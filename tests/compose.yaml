name: propel-json-behavior-tests
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: json_test
      MYSQL_DATABASE: json_behavior
    ports: [ "127.0.0.1:33361:3306" ]
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pjson_test" ]
      interval: 5s
      timeout: 5s
      retries: 40
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: json_test
      MARIADB_DATABASE: json_behavior
    ports: [ "127.0.0.1:33362:3306" ]
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 40
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: json_test
      POSTGRES_DB: json_behavior
    ports: [ "127.0.0.1:35433:5432" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d json_behavior" ]
      interval: 5s
      timeout: 5s
      retries: 40
